name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mapheim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mapheim.apk
          gh release create android-latest Mapheim.apk --title "Mapheim para Android" --notes "Instala Mapheim.apk en tu Android (permite instalar apps desconocidas)." --prerelease \
            || gh release upload android-latest Mapheim.apk --clobber
