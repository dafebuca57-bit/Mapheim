name: Mapheim
options:
  bundleIdPrefix: com.mapheim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Mapheim:
    type: application
    platform: iOS
    sources:
      - path: Mapheim
    info:
      path: Mapheim/Info.plist
      properties:
        CFBundleDisplayName: Mapheim
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        UIAppFonts:
          - UncialAntiqua-Regular.ttf
          - Cinzel-Regular.ttf
          - Cinzel-Bold.ttf
        NSLocationWhenInUseUsageDescription: "Mapheim usa tu ubicación para despejar la niebla del mapa y descubrir lugares mientras caminas."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mapheim sigue tu recorrido con la pantalla bloqueada para despejar la niebla y avisarte de lugares nuevos."
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapheim.app
        PRODUCT_NAME: Mapheim
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO

schemes:
  Mapheim:
    build:
      targets:
        Mapheim: all
    run:
      config: Debug
    archive:
      config: Release
